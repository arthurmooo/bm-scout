name: BM Scout agent tasks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Queue mode"
        required: true
        default: "real"
        type: choice
        options:
          - real
          - offline
  schedule:
    - cron: "30 12 * * 1-5"

jobs:
  consume-agent-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
      OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL || vars.OPENAI_MODEL || 'gpt-5.5' }}
      BM_SCOUT_PROVIDER: ${{ vars.BM_SCOUT_PROVIDER || 'auto' }}
      BM_SCOUT_SEARCH_QUERIES: ${{ vars.BM_SCOUT_SEARCH_QUERIES }}
      BM_SCOUT_REAL_SEEDS: ${{ vars.BM_SCOUT_REAL_SEEDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e "services/agent-worker[dev]"
      - name: Run cron and write readiness evidence
        run: |
          MODE="real"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "offline" ]; then
            MODE="offline"
          fi
          npm run agent:cron:evidence -- --mode="$MODE" --limit=10 --stale-minutes=90
      - name: Upload cron evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-scout-agent-task-evidence
          path: artifacts/agent-tasks/*.json
          if-no-files-found: warn
