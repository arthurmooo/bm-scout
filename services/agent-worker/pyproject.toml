[project]
name = "bm-scout-agent-worker"
version = "0.1.0"
description = "Worker agentique BM Scout V1 avec OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
  "openai-agents==0.17.4",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
bm-scout-worker = "bm_scout_worker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
